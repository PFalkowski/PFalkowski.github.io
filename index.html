<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Piotr Falkowski — CV</title>

		<!--
			This repository used to serve a second, hand-maintained copy of the CV.
			It had drifted about two years behind the real one, and search engines
			had two competing versions of the same document to choose from.

			There is now one CV, built from PFalkowski/cv and published at /cv/.
			This page exists only to send people there. Do not add content here.
		-->
		<link rel="canonical" href="https://pfalkowski.github.io/cv/" />
		<meta name="robots" content="noindex, follow" />
		<meta http-equiv="refresh" content="0; url=/cv/" />

		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
					sans-serif;
				background: #f0f2f5;
				color: #2b2f36;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #0c0f14;
					color: #e3e8ef;
				}
			}
			main {
				text-align: center;
				padding: 2rem;
			}
			a {
				color: #0056b3;
			}
			@media (prefers-color-scheme: dark) {
				a {
					color: #7cb8ff;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<p>The CV has moved.</p>
			<p><a href="/cv/">pfalkowski.github.io/cv</a></p>
		</main>
		<script>
			// Replace rather than assign, so Back does not bounce off this page.
			location.replace('/cv/');
		</script>
	</body>
</html>
